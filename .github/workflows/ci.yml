name: CI

# Runs on every PR and on pushes to main. The "required" jobs below are all
# currently green against the tree. eslint (web-lint) became a hard gate on
# 2026-07-08 after the inherited backlog (78 problems — 54 errors, 24
# warnings; drifted from an original count of 66 errors as of 2026-06-11)
# was cleared to zero — see git history for the cleanup
# (chore/web-eslint-cleanup branch).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Hard gates: must pass to merge ──────────────────────────────────────────

  guards:
    name: Repo guards (auth + migrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Route auth guard
        run: node frontend/web/scripts/check-route-auth.mjs
      - name: Migration version lint
        run: node shared/supabase/scripts/lint-migrations.mjs
      # Theme-token guard — became a hard gate on 2026-08-07 once the
      # 630-finding palette backlog was migrated (Phases 0-5 of
      # docs/UI_IMPROVEMENT_2026-08-06.md). Same deal as the auth guard:
      # a finding is fixed, or allowlisted with a written reason.
      - name: Theme token guard
        run: node frontend/web/scripts/check-theme-tokens.mjs
      # Schema guards — added after the 2026-08-08 outage, in which save.ts
      # wrote three columns `jobs` did not have, every upsert failed, no job
      # was ever saved, and the pipeline still logged "run complete". Nothing
      # compared the code, the migrations and the live database to each other.
      #
      # Both SKIP (exit 0, with a loud notice) when the Supabase secrets are
      # absent, so forks and secret-less runs are not blocked — a skip is
      # visible in the log rather than being a silent pass.
      - name: Code vs live schema
        run: node shared/supabase/scripts/check-code-schema.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Catches the OTHER half: a column hand-applied to the database and never
      # written into a migration. That is how the visa columns were lost — they
      # existed in the old Supabase project but in no file, so a new project
      # built from the files alone came up without them.
      - name: Migrations vs live schema
        run: node shared/supabase/scripts/check-schema-drift.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Proves the check-code-schema parser still detects the historical bug —
      # a guard whose detector silently breaks is worse than none, and this one
      # needs no credentials, so it runs everywhere.
      - name: Schema guard self-test
        run: node shared/supabase/scripts/check-code-schema.mjs --self-test

  web-typecheck:
    name: web · typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  api-tests:
    name: api · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/api/requirements.txt
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: pytest -q

  # web's 5 vitest suites (theme-contrast WCAG, dashboard data derivation, the
  # BUG-18 auth-recovery regression, CV review characterization) previously ran
  # in no workflow at all — only deploy.yml's post-merge gate covered the
  # worker/api suites. Mirrors web-lint below.
  web-tests:
    name: web · vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - run: npm test

  # Worker previously had no PR gate at all — its typecheck+test only ran in
  # deploy.yml, which triggers on push to main (= production, per CLAUDE.md).
  # That caught regressions only after they were already merged. This job is
  # unconditional (unlike deploy.yml's path-filtered gate-worker) to match how
  # web-typecheck/api-tests already run on every PR regardless of what changed.
  worker-gate:
    name: worker · typecheck + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/worker/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  web-lint:
    name: web · eslint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - run: npx eslint .
